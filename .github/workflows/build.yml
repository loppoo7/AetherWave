name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # The project intentionally does not rely on a checked-in gradle-wrapper.jar.
      # Generate a matching wrapper on the runner before using ./gradlew.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Package v1.0.0 source archive
        run: |
          mkdir -p /tmp/aetherwave-archive/AetherWave
          rsync -a --exclude=".git" --exclude="app/build" --exclude=".gradle" ./ /tmp/aetherwave-archive/AetherWave/
          cd /tmp/aetherwave-archive
          zip -qr "$GITHUB_WORKSPACE/AetherWave-v1.0.0.zip" AetherWave

      - name: Upload v1.0.0 source archive
        uses: actions/upload-artifact@v7
        with:
          name: AetherWave-v1.0.0-source
          path: AetherWave-v1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AetherWave-v1.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
